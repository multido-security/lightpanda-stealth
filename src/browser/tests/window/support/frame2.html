<!DOCTYPE html>
<script>
  // Like Chrome, reading a cross-origin window's document throws a SecurityError
  let document_access;
  try {
    document_access = window.top.document === undefined ? 'undefined' : 'readable';
  } catch (e) {
    document_access = e.name + '/' + (e instanceof DOMException);
  }
  window.top.postMessage({
    url: location.toString(),
    document_access,
  }, '*')
</script>
