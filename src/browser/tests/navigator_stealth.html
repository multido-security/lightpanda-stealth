<!DOCTYPE html>
<script src="testing.js"></script>

<!-- Lightpanda presents as a regular (headful, non-automated) desktop Chrome. -->
<script id=stealth_navigator>
  const ua = navigator.userAgent;
  testing.expectEqual(true, ua.startsWith('Mozilla/5.0 ('));
  // The test runner suffixes the user agent with " internal-tester".
  testing.expectEqual(true, / AppleWebKit\/537\.36 \(KHTML, like Gecko\) Chrome\/\d+\.0\.0\.0 Safari\/537\.36 internal-tester$/.test(ua));
  testing.expectEqual(false, ua.includes('Headless'));
  testing.expectEqual(false, ua.includes('Lightpanda'));

  // Chrome: appVersion is the user agent without "Mozilla/".
  testing.expectEqual(ua.substring('Mozilla/'.length), navigator.appVersion);
  testing.expectEqual('Google Inc.', navigator.vendor);
  testing.expectEqual('Netscape', navigator.appName);
  testing.expectEqual('Mozilla', navigator.appCodeName);
  testing.expectEqual('Gecko', navigator.product);
  testing.expectEqual(false, navigator.webdriver);

  // navigator.platform agrees with the user agent's OS token.
  const platforms = {
    'X11; Linux x86_64': 'Linux x86_64',
    'Macintosh; Intel Mac OS X 10_15_7': 'MacIntel',
    'Windows NT 10.0; Win64; x64': 'Win32',
  };
  const os = ua.substring('Mozilla/5.0 ('.length, ua.indexOf(')'));
  testing.expectEqual(platforms[os], navigator.platform);

  testing.expectEqual('en-US', navigator.language);
  testing.expectEqual('en-US,en', navigator.languages.join());
  testing.expectEqual('en-US', Intl.DateTimeFormat().resolvedOptions().locale);
</script>

<script id=stealth_userAgentData>
  const major = navigator.userAgent.match(/Chrome\/(\d+)\./)[1];
  const brands = navigator.userAgentData.brands;
  testing.expectEqual(3, brands.length);
  const byName = (list, name) => list.find((b) => b.brand === name);
  testing.expectEqual(major, byName(brands, 'Google Chrome').version);
  testing.expectEqual(major, byName(brands, 'Chromium').version);
  // The GREASE brand: "Not" + a char + "A" + a char + "Brand".
  const grease = brands.find((b) => b.brand.startsWith('Not'));
  testing.expectEqual(true, /^Not.A.Brand$/.test(grease.brand));
  testing.expectEqual(false, navigator.userAgentData.mobile);

  const uaPlatforms = { 'Linux x86_64': 'Linux', 'MacIntel': 'macOS', 'Win32': 'Windows' };
  testing.expectEqual(uaPlatforms[navigator.platform], navigator.userAgentData.platform);
  testing.expectEqual(navigator.userAgentData.platform, navigator.userAgentData.toJSON().platform);
</script>

<script id=stealth_userAgentData_highEntropy type=module>
  {
    const state = await testing.async();
    const v = await navigator.userAgentData.getHighEntropyValues(['fullVersionList']);
    state.resolve();

    await state.done(() => {
      const major = navigator.userAgent.match(/Chrome\/(\d+)\./)[1];
      const chrome = v.fullVersionList.find((b) => b.brand === 'Google Chrome');
      testing.expectEqual(true, chrome.version.startsWith(major + '.'));
      testing.expectEqual(chrome.version, v.uaFullVersion);
      testing.expectEqual(true, v.platformVersion.length > 0);
    });
  }
</script>

<script id=stealth_worker type=module>
  {
    const state = await testing.async();
    const src = `postMessage([navigator.userAgent, navigator.appVersion, navigator.vendor, navigator.platform].join('|'))`;
    const worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    const got = await new Promise((resolve) => { worker.onmessage = (e) => resolve(e.data); });
    state.resolve();

    await state.done(() => {
      testing.expectEqual([navigator.userAgent, navigator.appVersion, navigator.vendor, navigator.platform].join('|'), got);
    });
  }
</script>

<script id=stealth_plugins>
  testing.expectEqual(5, navigator.plugins.length);
  testing.expectEqual('PDF Viewer', navigator.plugins[0].name);
  testing.expectEqual('internal-pdf-viewer', navigator.plugins[0].filename);
  testing.expectEqual('Portable Document Format', navigator.plugins[0].description);
  testing.expectEqual(navigator.plugins[0], navigator.plugins[0]);
  testing.expectEqual(navigator.plugins[1], navigator.plugins.namedItem('Chrome PDF Viewer'));
  testing.expectEqual(navigator.plugins[4], navigator.plugins['WebKit built-in PDF']);
  testing.expectEqual(true, navigator.plugins[0] instanceof Plugin);
  testing.expectEqual(2, navigator.plugins[0].length);
  testing.expectEqual('application/pdf', navigator.plugins[0][0].type);
  testing.expectEqual('0,1,2,3,4', Object.keys(navigator.plugins).join());
  testing.expectEqual(5, [...navigator.plugins].length);

  testing.expectEqual(2, navigator.mimeTypes.length);
  testing.expectEqual(true, navigator.mimeTypes instanceof MimeTypeArray);
  testing.expectEqual('application/pdf', navigator.mimeTypes[0].type);
  testing.expectEqual('text/pdf', navigator.mimeTypes[1].type);
  testing.expectEqual('pdf', navigator.mimeTypes[0].suffixes);
  testing.expectEqual(navigator.plugins[0], navigator.mimeTypes['application/pdf'].enabledPlugin);
  testing.expectEqual(true, navigator.mimeTypes[0] instanceof MimeType);
  testing.expectEqual(true, navigator.pdfViewerEnabled);
</script>

<script id=stealth_hardware>
  testing.expectEqual(true, [4, 8, 12, 16].includes(navigator.hardwareConcurrency));
  testing.expectEqual(true, [4, 8].includes(navigator.deviceMemory));
</script>

<script id=stealth_window_geometry>
  // A headful window: the toolbar makes it taller than its viewport, and the
  // screen holds it.
  testing.expectEqual(innerWidth, outerWidth);
  testing.expectEqual(true, outerHeight > innerHeight);
  testing.expectEqual(true, screen.width >= outerWidth);
  testing.expectEqual(true, screen.availHeight >= outerHeight);
  testing.expectEqual(true, screen.height > screen.availHeight);
  testing.expectEqual(true, matchMedia('(device-width: ' + screen.width + 'px)').matches);
  testing.expectEqual(true, matchMedia('(device-height: ' + screen.height + 'px)').matches);
</script>
