<!DOCTYPE html>
<script src="../testing.js"></script>

<!-- A WebGL context that renders nothing but has Chrome's whole API. -->
<script id=interfaces>
  for (const name of ['WebGLRenderingContext', 'WebGL2RenderingContext', 'WebGLBuffer', 'WebGLProgram', 'WebGLShader', 'WebGLTexture', 'WebGLShaderPrecisionFormat']) {
    testing.expectEqual('function', typeof window[name]);
    testing.expectEqual(`function ${name}() { [native code] }`, Function.prototype.toString.call(window[name]));
  }
  testing.expectError('TypeError', () => new WebGLRenderingContext());
  // Extension interfaces have no global constructor in Chrome.
  testing.expectEqual('undefined', typeof WEBGL_debug_renderer_info);
  testing.expectEqual('undefined', typeof ANGLE_instanced_arrays);
  // Constants on the interface and its instances.
  testing.expectEqual(0x8B31, WebGLRenderingContext.VERTEX_SHADER);
  testing.expectEqual(0x8B31, WebGLRenderingContext.prototype.VERTEX_SHADER);
  testing.expectEqual(0x8C2F, WebGL2RenderingContext.ANY_SAMPLES_PASSED);
  // Chrome's method lengths.
  testing.expectEqual(3, WebGLRenderingContext.prototype.bufferData.length);
  testing.expectEqual(6, WebGLRenderingContext.prototype.texImage2D.length);
  testing.expectEqual(6, WebGLRenderingContext.prototype.vertexAttribPointer.length);
  testing.expectEqual(10, WebGL2RenderingContext.prototype.blitFramebuffer.length);
</script>

<script id=get_context>
{
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl');
  testing.expectEqual(true, gl instanceof WebGLRenderingContext);
  testing.expectEqual(gl, canvas.getContext('webgl'));
  testing.expectEqual(gl, canvas.getContext('experimental-webgl'));
  testing.expectEqual(null, canvas.getContext('2d'));
  testing.expectEqual(null, canvas.getContext('webgl2'));
  testing.expectEqual(canvas, gl.canvas);
  testing.expectEqual(300, gl.drawingBufferWidth);
  testing.expectEqual(150, gl.drawingBufferHeight);
  testing.expectEqual(false, gl.isContextLost());
  testing.expectEqual(0, gl.getError());

  const gl2 = document.createElement('canvas').getContext('webgl2');
  testing.expectEqual(true, gl2 instanceof WebGL2RenderingContext);
  testing.expectEqual(false, gl2 instanceof WebGLRenderingContext);

  // 2d still works on its own canvas.
  testing.expectEqual(true, document.createElement('canvas').getContext('2d') instanceof CanvasRenderingContext2D);
}
</script>

<script id=parameters>
  {
    const gl = document.createElement('canvas').getContext('webgl');
    testing.expectEqual('WebKit', gl.getParameter(gl.VENDOR));
    testing.expectEqual('WebKit WebGL', gl.getParameter(gl.RENDERER));
    testing.expectEqual('WebGL 1.0 (OpenGL ES 2.0 Chromium)', gl.getParameter(gl.VERSION));
    testing.expectEqual(16384, gl.getParameter(gl.MAX_TEXTURE_SIZE));
    testing.expectEqual(true, gl.getParameter(gl.MAX_VIEWPORT_DIMS) instanceof Int32Array);
    testing.expectEqual('1,1024', gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE).join());
    testing.expectEqual('0,0,300,150', gl.getParameter(gl.VIEWPORT).join());
    testing.expectEqual(true, gl.getParameter(gl.COLOR_WRITEMASK)[0]);
    testing.expectEqual(null, gl.getParameter(gl.ARRAY_BUFFER_BINDING));
    testing.expectEqual(null, gl.getParameter(0x1234));

    const info = gl.getExtension('WEBGL_debug_renderer_info');
    testing.expectEqual(info, gl.getExtension('webgl_debug_renderer_info'));
    testing.expectEqual('[object WEBGL_debug_renderer_info]', Object.prototype.toString.call(info));
    testing.expectEqual(0x9245, info.UNMASKED_VENDOR_WEBGL);
    testing.expectEqual(true, gl.getParameter(info.UNMASKED_VENDOR_WEBGL).startsWith('Google Inc. ('));
    testing.expectEqual(true, gl.getParameter(info.UNMASKED_RENDERER_WEBGL).startsWith('ANGLE ('));

    const exts = gl.getSupportedExtensions();
    testing.expectEqual(true, exts.includes('ANGLE_instanced_arrays'));
    for (const name of exts) {
      testing.expectEqual(true, gl.getExtension(name) !== null);
    }
    testing.expectEqual(null, gl.getExtension('NOT_AN_EXTENSION'));

    const attrs = gl.getContextAttributes();
    testing.expectEqual(true, attrs.antialias);
    testing.expectEqual('default', attrs.powerPreference);

    const p = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
    testing.expectEqual(true, p instanceof WebGLShaderPrecisionFormat);
    testing.expectEqual(23, p.precision);
    testing.expectEqual(127, p.rangeMax);
  }
  {
    const gl = document.createElement('canvas').getContext('webgl2');
    testing.expectEqual('WebGL 2.0 (OpenGL ES 3.0 Chromium)', gl.getParameter(gl.VERSION));
    testing.expectEqual(8, gl.getParameter(gl.MAX_DRAW_BUFFERS));
    testing.expectEqual(true, gl.getSupportedExtensions().includes('EXT_color_buffer_float'));
  }
</script>

<script id=draw>
{
  // What a WebGL page (or fingerprinting script) does: all of it succeeds.
  const gl = document.createElement('canvas').getContext('webgl');
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0, 1); }');
  gl.compileShader(vs);
  testing.expectEqual(true, gl.getShaderParameter(vs, gl.COMPILE_STATUS));
  testing.expectEqual(gl.VERTEX_SHADER, gl.getShaderParameter(vs, gl.SHADER_TYPE));
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, 'void main() { gl_FragColor = vec4(1); }');
  gl.compileShader(fs);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  testing.expectEqual(true, gl.getProgramParameter(program, gl.LINK_STATUS));
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  testing.expectEqual(true, buffer instanceof WebGLBuffer);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, 'p');
  testing.expectEqual(0, loc);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  testing.expectEqual(true, gl.getUniformLocation(program, 'u') instanceof WebGLUniformLocation);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const pixels = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  testing.expectEqual(gl.FRAMEBUFFER_COMPLETE, gl.checkFramebufferStatus(gl.FRAMEBUFFER));

  const vao = gl.getExtension('OES_vertex_array_object');
  const v = vao.createVertexArrayOES();
  vao.bindVertexArrayOES(v);
  gl.getExtension('ANGLE_instanced_arrays').drawArraysInstancedANGLE(gl.TRIANGLES, 0, 3, 2);
  gl.getExtension('WEBGL_lose_context').loseContext();
  testing.expectEqual(0, gl.getError());
}
</script>
